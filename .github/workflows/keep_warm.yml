name: Keep App Warm

on:
  schedule:
    - cron: '*/45 * * * *' # Runs every 45 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployment URL
        run: |
          curl -i https://cogniflow-5c687.containers.snapdeploy.app/
